name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Release publishing needs write access to create/update tags and assets.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware (all targets)
        run: pio run -e smalltv -e smalltv_c2 -e smalltv_esp32 -e smalltv_loader

      # One app image per target (web-UI OTA + GitHub self-update), the merged
      # factory images for first-time USB flashing of the ESP32 boards, and the
      # minimal loader used to install onto a SmallTV-ultra.
      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp .pio/build/smalltv/firmware.bin               dist/smalltv-mod-firmware.bin
          cp .pio/build/smalltv_c2/firmware.bin            dist/smalltv-mod-firmware-c2.bin
          cp .pio/build/smalltv_c2/firmware.factory.bin    dist/smalltv-mod-firmware-c2.factory.bin
          cp .pio/build/smalltv_esp32/firmware.bin         dist/smalltv-mod-firmware-esp32.bin
          cp .pio/build/smalltv_esp32/firmware.factory.bin dist/smalltv-mod-firmware-esp32.factory.bin
          cp .pio/build/smalltv_loader/firmware.bin        dist/smalltv-mod-loader.bin

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: smalltv-mod-firmware
          path: dist/

      - name: Read firmware version
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: fwver
        run: |
          version=$(grep '#define FW_VERSION' src/config.h | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Firmware version: $version (tag v$version)"

      - name: Generate checksums
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Publish (or refresh) the GitHub release on every main push. The tag is
      # derived from FW_VERSION in src/config.h so OTA self-update and the
      # Releases page stay in sync without a separate manual tagging step.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.fwver.outputs.tag }}
          name: smalltv-mod ${{ steps.fwver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
