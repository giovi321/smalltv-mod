name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# The release-attach step needs write access to create/update the release asset.
permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # restore-keys matters more than the key does. A cold ~/.platformio is not
      # merely slower, it is the one state in which the build breaks (see the
      # SCons note below), and the key is a hash of platformio.ini, so every
      # ordinary edit to that file used to force the broken path and look like
      # the edit's fault. The prefix fallback reuses the last good cache instead.
      # The workflow file is in the key too: it pins the toolchain, so a change
      # here is a toolchain change and deserves a fresh entry.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', '.github/workflows/build.yml') }}
          restore-keys: |
            pio-${{ runner.os }}-

      # Pinned to 6.1.19 for the SCons it selects, and the pin has to reach TWO
      # cores. The envs carrying a custom_sdkconfig (smalltv_c2, smalltv_esp32,
      # and smalltv_esp32_wg through extends) rebuild the ESP-IDF libraries on a
      # cold ~/.platformio and then re-run the Arduino compile as a child
      # `pio run`. That child is not the pio installed below: the pioarduino
      # platform keeps its own venv at ~/.platformio/penv with its own core, the
      # PyPI package `pioarduino` (a fork of platformio-core), which the
      # platform's builder/penv_setup.py installs through uv with the spec
      # `pioarduino>=6.1.19`. pioarduino 6.2.0 reached PyPI on 2026-09-15 and
      # hard-requires tool-scons 4.11.1, whose SCons dies at firmware.elf with
      # "ModuleNotFoundError: No module named 'SCons.Tool.FortranCommon'"
      # (pioarduino/platform-espressif32#529 and #531). 6.1.19 requires 4.8.1,
      # which works. Every cold run since that date resolved to 6.2.0, which is
      # why the green caches looked like a fossil: they predate it.
      #
      # The log line "Please wait while upgrading... Pio has been successfully
      # upgraded to 6.2.0!" is the fork's after_upgrade notice on finding a
      # different last_version in appstate.json. Nothing upgrades anything, so a
      # constraint on `platformio` (runs 35156418997 and 35236058734) had nothing
      # to bind. The constraints file has to name `pioarduino`. penv_setup.py
      # runs uv with a copy of this job's environment and uv honours
      # UV_CONSTRAINT, so `pioarduino>=6.1.19` resolves to 6.1.19 instead of the
      # newest release. platformio==6.1.19 stays in the file for the pip install.
      #
      # When pioarduino's `stable` moves to a platform whose penv_setup asks for
      # `pioarduino>=6.2.0` (their develop branch already does), this constraint
      # conflicts and the build fails at "Failed to install Python dependencies
      # into penv". That is the cue to re-test without the pin, not to drop it
      # blind. Revisit when upstream closes #531.
      #
      # The venv is inside the cached path, so a run that installs 6.2.0 into it
      # poisons every run that restores it: 6.2.0 then asks for scons 4.11.1 with
      # no upgrade line in the log at all (run 35227546824). That is why the
      # cache must never be written by a red run, and why the plain actions/cache
      # post step, which declares post-if: success(), is the right behaviour here
      # rather than a restore/save split.
      - name: Pin PlatformIO and the pioarduino core for every pip and uv in this job
        run: |
          echo 'platformio==6.1.19' >  "${{ runner.temp }}/pio-constraints.txt"
          echo 'pioarduino==6.1.19' >> "${{ runner.temp }}/pio-constraints.txt"
          echo "PIP_CONSTRAINT=${{ runner.temp }}/pio-constraints.txt" >> "$GITHUB_ENV"
          echo "UV_CONSTRAINT=${{ runner.temp }}/pio-constraints.txt" >> "$GITHUB_ENV"

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Build firmware (all targets)
        run: pio run -e smalltv -e smalltv_lean -e smalltv_c2 -e smalltv_esp32 -e smalltv_esp32_wg -e smalltv_esp32_8mb -e smalltv_loader

      - name: Test theme engine and packer
        run: |
          pip install -r tools/requirements-theme.txt
          python3 -m unittest discover -s tests/theme -p 'test_*.py'
          python3 tools/theme_pack.py examples/themes/pixel-room /tmp/pixel-room.stheme
          cmp examples/themes/pixel-room.stheme /tmp/pixel-room.stheme
          python3 tools/theme_pack.py examples/themes/terminal-ops /tmp/terminal-ops.stheme
          cmp examples/themes/terminal-ops.stheme /tmp/terminal-ops.stheme
          python3 tools/theme_pack.py examples/themes/live-status /tmp/live-status.stheme
          cmp examples/themes/live-status.stheme /tmp/live-status.stheme
          sh tests/theme/run.sh
          node tests/theme/test_webui.js

      # Host-native, not board-specific: only needs ArduinoJson, which the
      # firmware build above already fetched into .pio/libdeps.
      - name: Test atomic settings storage
        run: |
          c++ -std=c++11 -Wall -Wextra -Werror -g -Isrc -I.pio/libdeps/smalltv_esp32_8mb/ArduinoJson/src \
            tests/test_storage.cpp -o /tmp/smalltv-storage-tests
          /tmp/smalltv-storage-tests

      # One app image per target (web-UI OTA + GitHub self-update), the merged
      # factory images for first-time USB flashing of the ESP32 boards, and the
      # minimal loader used to install onto a SmallTV-ultra. Two boards get a
      # second app image: the ESP8266 gets -lean, with Home Assistant and the
      # usage meter compiled out, and the NM-TV-154 gets -esp32-wg, with the
      # WireGuard client compiled in. UPDATE_ASSET in src/config.h maps each
      # build back to its own file name so self-update keeps a device on the
      # variant it runs.
      # always() with a tolerant copy, for the same reason as the upload below:
      # when one env dies the other six still built, and those binaries are
      # usually what the next question needs. A missing file is a warning here,
      # not a reason to hand over nothing. The build step's own exit status still
      # decides whether the run is red.
      - name: Stage artifacts
        if: always()
        run: |
          mkdir -p dist
          copy() { [ -f "$1" ] && cp "$1" "$2" || echo "missing: $1"; }
          copy .pio/build/smalltv/firmware.bin dist/smalltv-mod-firmware.bin
          copy .pio/build/smalltv_lean/firmware.bin dist/smalltv-mod-firmware-lean.bin
          copy .pio/build/smalltv_c2/firmware.bin dist/smalltv-mod-firmware-c2.bin
          copy .pio/build/smalltv_c2/firmware.factory.bin dist/smalltv-mod-firmware-c2.factory.bin
          copy .pio/build/smalltv_esp32/firmware.bin dist/smalltv-mod-firmware-esp32.bin
          copy .pio/build/smalltv_esp32/firmware.factory.bin dist/smalltv-mod-firmware-esp32.factory.bin
          copy .pio/build/smalltv_esp32_wg/firmware.bin dist/smalltv-mod-firmware-esp32-wg.bin
          copy .pio/build/smalltv_esp32_wg/firmware.factory.bin dist/smalltv-mod-firmware-esp32-wg.factory.bin
          copy .pio/build/smalltv_esp32_8mb/firmware.bin dist/smalltv-mod-firmware-esp32-pro.bin
          copy .pio/build/smalltv_esp32_8mb/firmware.factory.bin dist/smalltv-mod-firmware-esp32-pro.factory.bin
          copy .pio/build/smalltv_loader/firmware.bin dist/smalltv-mod-loader.bin

      # always(), so a run that dies after linking still hands over whatever was
      # produced. A size question cannot be answered from a red run with no
      # artifacts, and the step that reports sizes is the one that fails here.
      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smalltv-mod-firmware
          path: dist/
          if-no-files-found: warn

      # generate_release_notes fills the body with the commits and PRs since the
      # previous tag, so a release is never published blank. Editing the release
      # afterwards to write proper notes keeps whatever you put there: the action
      # only sets the body when it creates the release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
