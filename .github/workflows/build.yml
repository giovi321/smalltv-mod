name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# The release-attach step needs write access to create/update the release asset.
permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      # Pinned, because SCons 4.9 dropped SCons.Tool.FortranCommon and the ESP-IDF
      # builder still imports it: unpinned, the two envs carrying a custom sdkconfig
      # (smalltv_esp32, smalltv_c2) die with ModuleNotFoundError. Core selects SCons
      # itself, via a hard "tool-scons" range in platformio/dependencies.py, so
      # installing an older tool-scons alongside does nothing. 6.1.19 asks for
      # ~4.40801.0 (SCons 4.8.1, still has the module); 6.2.0 asks for ~4.41101.0
      # (SCons 4.11.1, does not). Only the core version decides, so pin that.
      #
      # This surfaced when the ~/.platformio cache expired: v2.13.0 built on
      # 2026-08-31 against a cached toolchain, and tool-scons 4.41101.0 had landed
      # on 2026-08-27. Revisit when PlatformIO or ESP-IDF stops needing 4.8.
      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Build firmware (all targets)
        run: pio run -e smalltv -e smalltv_lean -e smalltv_c2 -e smalltv_esp32 -e smalltv_esp32_8mb -e smalltv_loader

      # One app image per target (web-UI OTA + GitHub self-update), the merged
      # factory images for first-time USB flashing of the ESP32 boards, and the
      # minimal loader used to install onto a SmallTV-ultra. The ESP8266 gets a
      # second app image, -lean, with Home Assistant and the usage meter
      # compiled out; UPDATE_ASSET in src/config.h maps each build back to its
      # own file name so self-update keeps a device on the variant it runs.
      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp .pio/build/smalltv/firmware.bin               dist/smalltv-mod-firmware.bin
          cp .pio/build/smalltv_lean/firmware.bin          dist/smalltv-mod-firmware-lean.bin
          cp .pio/build/smalltv_c2/firmware.bin            dist/smalltv-mod-firmware-c2.bin
          cp .pio/build/smalltv_c2/firmware.factory.bin    dist/smalltv-mod-firmware-c2.factory.bin
          cp .pio/build/smalltv_esp32/firmware.bin         dist/smalltv-mod-firmware-esp32.bin
          cp .pio/build/smalltv_esp32/firmware.factory.bin dist/smalltv-mod-firmware-esp32.factory.bin
          cp .pio/build/smalltv_esp32_8mb/firmware.bin         dist/smalltv-mod-firmware-esp32-pro.bin
          cp .pio/build/smalltv_esp32_8mb/firmware.factory.bin dist/smalltv-mod-firmware-esp32-pro.factory.bin
          cp .pio/build/smalltv_loader/firmware.bin        dist/smalltv-mod-loader.bin

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: smalltv-mod-firmware
          path: dist/

      # generate_release_notes fills the body with the commits and PRs since the
      # previous tag, so a release is never published blank. Editing the release
      # afterwards to write proper notes keeps whatever you put there: the action
      # only sets the body when it creates the release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
